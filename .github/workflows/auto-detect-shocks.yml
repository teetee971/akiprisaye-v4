# ──────────────────────────────────────────────────────────────────────────────
# 🔍 Détection Automatique des Chocs de Prix
# ──────────────────────────────────────────────────────────────────────────────
#
# Analyse les snapshots Firestore et crée des alertes pour les variations
# significatives. Le workflow est volontairement déclenché après un scraping
# réussi ou manuellement; le schedule sert de filet de sécurité.
# ──────────────────────────────────────────────────────────────────────────────

name: 🔍 Détection Chocs de Prix

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_run:
    workflows: ['🤖 Scraping Automatique — Prix DOM-TOM']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: price-shock-detection
  cancel-in-progress: false

jobs:
  detect-shocks:
    name: 🔍 Analyse statistique chocs prix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: scripts/auto-shocks/package.json

      - name: 📦 Installer dépendances
        working-directory: scripts/auto-shocks
        run: npm install --no-audit --no-fund

      - name: 🔍 Détection des chocs
        working-directory: scripts/auto-shocks
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node detect.mjs --dry-run
          else
            node detect.mjs
          fi

      - name: 📢 Notification en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.warning('⚠️ Échec détection chocs de prix');
