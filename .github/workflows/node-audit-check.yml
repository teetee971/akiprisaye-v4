name: Node.js CI Audit & Linting

on:
  push:
    branches:
      - main
      - dependabot-ci-config
  pull_request:
    branches:
      - main

concurrency:
  group: node-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_audit:
    name: Install, Audit, Lint, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json

    - name: Install root dependencies
      run: npm ci --include=dev --no-audit --no-fund

    - name: Install frontend dependencies
      run: npm --prefix frontend ci --include=dev --legacy-peer-deps --no-audit --no-fund

    - name: Lint with ESLint
      run: npm run lint

    - name: Run smoke tests
      run: npm run test:smoke:home

    - name: Audit Dependencies
      run: npm audit --omit=dev --audit-level=high
