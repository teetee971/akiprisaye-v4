name: Dependency autofix (PR maintenance)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'maintenance/actions-refresh-2026-09-25'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh production dependency lockfile
        working-directory: frontend
        run: |
          npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
          npm audit fix --package-lock-only --omit=dev --legacy-peer-deps || true
          npm audit --omit=dev

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json frontend/package.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/package.json
          git commit -m "fix(security): refresh dependency lockfile after dead-code removal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
